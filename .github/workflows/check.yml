name: Build and synthetic evaluation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check --select F app evaluation tests
      - run: pytest -q
      - run: python -m compileall -q app evaluation tests
      - run: node --check app/static/app.js
      - run: python -m evaluation.run
      - run: docker build --tag cloud-cost-anomaly-explainer:ci .
      - name: Run container smoke check
        run: |
          docker run -d --name ccae-ci -p 127.0.0.1:8000:8000 cloud-cost-anomaly-explainer:ci
          cleanup() { docker logs ccae-ci || true; docker rm -f ccae-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/sample | python -c "import json,sys; d=json.load(sys.stdin); assert d['synthetic'] and len(d['alerts']) == 2"
